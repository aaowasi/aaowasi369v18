name: Verify engineering
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/validate_oscal.py
      - run: python scripts/install_opa.py
      - run: .tools/opa test policies -v
      - run: python -m engine.mcp_client
      - run: npm test
      - run: npm run build
      - run: npm run check
      - name: Install browser validation dependencies
        run: npm install --no-save playwright@1.58.2
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Validate desktop and mobile interactions
        run: |
          python3 -m http.server 4173 --directory dist --bind 127.0.0.1 > /tmp/aao-http.log 2>&1 &
          node scripts/browser-check.mjs
          node scripts/lighthouse.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: browser-verification
          path: docs/verification/
